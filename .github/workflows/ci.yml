name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go vet ./...
      - run: go test ./...
      - run: go run ./cmd/anycompare --summary --no-mtime testdata/left testdata/right
      - name: cross-compile linux amd64/arm64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/anycompare-amd64 ./cmd/anycompare
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/anycompare-arm64 ./cmd/anycompare
          file /tmp/anycompare-amd64 /tmp/anycompare-arm64
          /tmp/anycompare-amd64 --help
