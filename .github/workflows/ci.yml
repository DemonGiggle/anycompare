name: ci

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: format, vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -count=1 ./...
      - name: smoke test
        run: go run ./cmd/anycompare --summary --no-mtime testdata/left testdata/right

  build:
    name: make build and build-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: host binary
        run: make build
      - name: cross-compile linux amd64/arm64
        run: make build-all
      - name: verify artifacts
        run: |
          ls -l bin dist
          ./bin/anycompare --help
          ./bin/anycompare --summary --no-mtime testdata/left testdata/right
